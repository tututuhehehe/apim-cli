[package]
name = "apim"
version = "0.1.6"
edition = "2024"
rust-version = "1.88"
description = "Terminal manager for model-provider API keys"
license = "MIT"
repository = "https://github.com/tututuhehehe/apim-cli"
homepage = "https://github.com/tututuhehehe/apim-cli"
readme = "README.md"
keywords = ["api-key", "cli", "tui", "llm", "openai"]
categories = ["command-line-utilities", "development-tools"]
publish = false

# cargo-binstall：直接下载 GitHub Release 里的预编译二进制，不现场编译。
# 前置条件：crate 需先发布到 crates.io（binstall 靠 crates.io 元数据解析仓库）。
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.'cfg(windows)']
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
anyhow = "1"
arboard = "3"
base64 = "0.22"
jsonwebtoken = "9"
rand = "0.8"
sha2 = "0.10"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
# serde 的派生与 JSON 值；preserve_order 让 pi 的 models.json 改写后**保持用户的键顺序**
# （同 codex 那边用 toml_edit 保注释保顺序的理由；indexmap 本来就在依赖树里）
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
# codex 的 config.toml 要保注释保顺序地改写，toml 做不到（序列化会丢注释）
toml_edit = "0.22"
unicode-width = "0.2"
url = "2"

[lints.rust]
unsafe_code = "forbid"
