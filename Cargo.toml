[package]
name = "apim"
version = "0.1.0"
edition = "2024"
description = "Terminal manager for model-provider API keys"
publish = false

[dependencies]
anyhow = "1"
arboard = "3"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
unicode-width = "0.2"

[lints.rust]
unsafe_code = "forbid"
