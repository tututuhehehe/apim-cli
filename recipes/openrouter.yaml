# 内置厂商：同 id 用户 YAML 可覆盖。
#
# 字段来源：openrouter.ai 文档「Credits」GET /api/v1/credits（2026-09 核对），
# 响应形如 {"data":{"total_credits":12.5,"total_usage":3.2}}。
# total_credits 是累计充值总额；剩余 = 总额 - 已用，脚本里算好再输出。

id: openrouter
name: OpenRouter
base_url: https://openrouter.ai/api/v1
# 控制面板：TUI 选中厂商按 Enter 打开
homepage: https://openrouter.ai/credits

auth:
  kind: bearer

health:
  method: GET
  # /models 是公开端点（坏 key 也 200，探活会假阳性）；/key 才校验 Bearer（坏 key 401）
  url: "{base_url}/key"

balance:
  kind: script
  command: ~/.config/apim/scripts/openrouter-quota.sh
  timeout_secs: 15
