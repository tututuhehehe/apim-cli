# Provider recipe. Drop another YAML into ~/.config/apim/recipes/ to add a
# vendor without recompiling. User files override these builtins by `id`.

id: deepseek
name: DeepSeek
base_url: https://api.deepseek.com
# 控制面板：TUI 选中厂商按 Enter 打开
homepage: https://platform.deepseek.com
supports_groups: false

auth:
  kind: bearer

health:
  method: GET
  url: "{base_url}/models"

balance:
  kind: script
  command: ~/.config/apim/scripts/deepseek-quota.sh
  timeout_secs: 15
