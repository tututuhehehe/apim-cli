# Provider recipe. Drop another YAML into ~/.config/apim/recipes/ to add a
# vendor without recompiling. User files override these builtins by `id`.

id: deepseek
name: DeepSeek
base_url: https://api.deepseek.com
supports_groups: false

auth:
  kind: bearer

health:
  method: GET
  url: "{base_url}/models"

balance:
  request:
    method: GET
    url: "{base_url}/user/balance"
    headers:
      Accept: application/json
  parse:
    # JSON dotted paths relative to the response root.
    available: is_available
    # Each element of this array becomes one "额度" card.
    items: balance_infos
  render:
    # Placeholders are flattened keys from each item object.
    headline: "{total_balance}"
    fields:
      - label: 总额
        value: "{total_balance}"
      - label: 充值
        value: "{topped_up_balance}"
      - label: 赠款
        value: "{granted_balance}"
