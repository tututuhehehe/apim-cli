# 内置厂商：同 id 用户 YAML 可覆盖。
#
# 字段来源：Moonshot 开放平台文档「查询账户余额」GET /v1/users/me/balance
# （2026-09 核对，platform.moonshot.cn 已 301 至 platform.kimi.com/docs/api/balance），
# 响应形如 {"code":0,"status":true,"data":{"available_balance":49.58894,...}}。
# 顶层 status 为请求状态布尔，用作 available。

id: moonshot
name: Moonshot AI
base_url: https://api.moonshot.cn
# 控制面板：TUI 选中厂商按 Enter 打开
homepage: https://platform.moonshot.cn

auth:
  kind: bearer

health:
  method: GET
  url: "{base_url}/v1/models"

balance:
  kind: script
  command: ~/.config/apim/scripts/moonshot-quota.sh
  timeout_secs: 15
