name: Publish to npm

# 触发：Release 转正（release.yml 最后一步 `gh release edit --draft=false --latest`）后**自动**发布，
# 版本号取自 tag；`workflow_dispatch` 保留给重跑/补发（同一个版本不能重复发，npm 不允许覆盖）。
# 首次发布必须本地 login 后手动跑 scripts/publish-npm.mjs <version> --publish，
# 并在 npmjs.com 为 6 个包配好 Trusted Publisher（仓库 + 本文件名），之后本 workflow 免 token 发布。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 0.1.0，不带 v；需已有对应 Release）"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) + provenance 签名

jobs:
  publish:
    name: 组装并发布 npm 包
    runs-on: ubuntu-latest
    steps:
      - name: 解析版本号（release 取 tag，手动触发取输入；统一去掉 v 前缀）
        id: version
        env:
          RAW_VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          VERSION="${RAW_VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "拿不到版本号（release tag / 手动输入都是空的）" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 六个包都在 npm 上才跳过（幂等；少一个就继续发，顺便修复半发状态）
        id: exists
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          missing=""
          for pkg in apim-cli apim-cli-darwin-arm64 apim-cli-darwin-x64 apim-cli-linux-x64 apim-cli-linux-arm64 apim-cli-windows-x64; do
            npm view "${pkg}@${VERSION}" version >/dev/null 2>&1 || missing="${missing} ${pkg}"
          done
          if [ -z "$missing" ]; then
            echo "六个包都已经是 ${VERSION}，跳过发布"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "还缺：${missing} —— 继续发布（脚本会跳过已存在的）"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 检出对应 tag（用该版本的组装脚本）
        if: steps.exists.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: v${{ steps.version.outputs.value }}

      - uses: actions/setup-node@v4
        if: steps.exists.outputs.skip != 'true'
        with:
          node-version: "22"
        # 不设 registry-url：避免生成带 NODE_AUTH_TOKEN 占位的 .npmrc，让 npm 走 OIDC

      - name: 升级 npm（Trusted Publishing 需 >= 11.5.1）
        if: steps.exists.outputs.skip != 'true'
        run: npm install -g npm@latest

      - name: 组装并发布
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-npm.mjs "${{ steps.version.outputs.value }}" --publish
